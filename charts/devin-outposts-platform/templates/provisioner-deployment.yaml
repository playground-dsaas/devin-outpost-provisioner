{{- if .Values.provisioner.enabled }}
{{- $p := .Values.provisioner }}
{{- if not $p.token.existingSecret }}
{{- fail "provisioner.token.existingSecret is required: a Secret in the release namespace holding the Devin service-user token" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.provisioner.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
spec:
  # One replica, Recreate: a pass is serial and idempotent; two provisioners
  # would race on Outpost creation.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "platform.provisioner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.provisioner.selectorLabels" . | nindent 8 }}
        {{- with $p.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $p.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "platform.provisioner.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with $p.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: org-provisioner
          image: "{{ required "provisioner.image.repository is required" $p.image.repository }}:{{ required "provisioner.image.tag is required" $p.image.tag }}"
          imagePullPolicy: {{ $p.image.pullPolicy }}
          env:
            - name: DEVIN_API_URL
              value: {{ $p.devinApiUrl | quote }}
            - name: DEVIN_TOKEN_FILE
              value: /var/run/secrets/devin/{{ $p.token.secretKey }}
            - name: MANIFESTS_PATH
              value: /etc/org-provisioner/manifests.yaml
            - name: NAMESPACE_PREFIX
              value: {{ $p.namespacePrefix | quote }}
            - name: OUTPOST_NAME_PREFIX
              value: {{ $p.outpostNamePrefix | quote }}
            - name: EXCLUDE_ORG_IDS
              value: {{ join "," $p.excludeOrgIds | quote }}
            - name: DELETE_ORPHAN_NAMESPACES
              value: {{ $p.deleteOrphanNamespaces | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ $p.pollIntervalSeconds | quote }}
            - name: RUST_LOG
              value: {{ $p.logLevel | quote }}
            {{- with $p.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $p.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $p.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: manifests
              mountPath: /etc/org-provisioner
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/devin
              readOnly: true
      volumes:
        - name: manifests
          configMap:
            name: {{ include "platform.provisioner.name" . }}-manifests
        - name: token
          secret:
            secretName: {{ $p.token.existingSecret }}
            items:
              - key: {{ $p.token.secretKey }}
                path: {{ $p.token.secretKey }}
{{- end }}
