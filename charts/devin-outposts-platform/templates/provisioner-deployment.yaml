{{- if .Values.provisioner.enabled }}
{{- include "platform.provisioner.tokenCheck" . }}
{{- $p := .Values.provisioner }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.provisioner.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
spec:
  # One replica, Recreate: a pass is serial and idempotent; two provisioners
  # would race on Outpost creation.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "platform.provisioner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.provisioner.selectorLabels" . | nindent 8 }}
        {{- with $p.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/pool-template: {{ toYaml .Values.poolTemplate | sha256sum }}
        {{- if $p.metrics.service.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        {{- end }}
        {{- with $p.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "platform.provisioner.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with $p.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: org-provisioner
          image: "{{ $p.image.repository }}:{{ $p.image.tag }}"
          imagePullPolicy: {{ $p.image.pullPolicy }}
          env:
            - name: DEVIN_API_URL
              value: {{ $p.devinApiUrl | quote }}
            {{- if $p.token.existingSecret }}
            - name: OUTPOSTS_TOKEN_FILE
              value: /var/run/secrets/devin/{{ $p.token.secretKey }}
            {{- else }}
            - name: OUTPOSTS_TOKEN_SECRET_ID
              value: {{ $p.token.awsSecretId | quote }}
            {{- with $p.token.awsRegion }}
            - name: AWS_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: NAMESPACE_PREFIX
              value: {{ $p.namespacePrefix | quote }}
            - name: OUTPOST_NAME_PREFIX
              value: {{ $p.outpostNamePrefix | quote }}
            - name: EXCLUDE_ORG_IDS
              value: {{ join "," $p.excludeOrgIds | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ $p.pollIntervalSeconds | quote }}
            - name: DEPROVISION_GRACE_SECONDS
              value: {{ $p.deprovisionGraceSeconds | quote }}
            - name: POOL_TEMPLATE_PATH
              value: /etc/org-provisioner/pool-template.yaml
            - name: WORKER_IMAGES_PATH
              value: /etc/org-provisioner/worker-images.yaml
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_ADDR
              value: 0.0.0.0:8080
            - name: RUST_LOG
              value: {{ printf "%s,org_provisioner=%s" $p.logLevel $p.logLevel | quote }}
            {{- with $p.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          {{- with $p.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $p.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/org-provisioner
              readOnly: true
            {{- if $p.token.existingSecret }}
            - name: outposts-token
              mountPath: /var/run/secrets/devin
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ include "platform.provisioner.name" . }}-pool-template
              - configMap:
                  name: {{ include "platform.provisioner.name" . }}-worker-images
        {{- if $p.token.existingSecret }}
        - name: outposts-token
          secret:
            secretName: {{ $p.token.existingSecret }}
            items:
              - key: {{ $p.token.secretKey }}
                path: {{ $p.token.secretKey }}
        {{- end }}
{{- end }}
