{{- if .Values.provisioner.enabled }}
# Applied into every org namespace each pass, in key order, after the
# Namespace and token Secret. {{ "{{ namespace }}" }}, {{ "{{ org_id }}" }},
# {{ "{{ org_name }}" }}, {{ "{{ org_slug }}" }}, {{ "{{ outpost_id }}" }} and
# {{ "{{ outpost_name }}" }} are substituted by the provisioner. The first
# document is added by this chart: it lets the operator work in the namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.provisioner.name" . }}-manifests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
data:
  manifests.yaml: |
    {{- if .Values.operator.enabled }}
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ include "platform.operator.serviceAccountName" . }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: {{ include "platform.operator.orgRole" . }}
    subjects:
      - kind: ServiceAccount
        name: {{ include "platform.operator.serviceAccountName" . }}
        namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- range $key, $doc := .Values.manifests }}
    {{- if $doc }}
    ---
    # manifests.{{ $key }}
    {{- toYaml $doc | nindent 4 }}
    {{- end }}
    {{- end }}
{{- end }}
