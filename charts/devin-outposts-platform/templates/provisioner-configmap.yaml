{{- if .Values.provisioner.enabled }}
# The pool template every org's OutpostPool, ResourceQuota, LimitRange and
# NetworkPolicy are rendered from (schema: provisioner/src/template.rs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.provisioner.name" . }}-pool-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
{{- $pt := deepCopy .Values.poolTemplate }}
{{- $bindings := list (dict "name" (include "platform.provisioner.name" .) "clusterRole" (include "platform.provisioner.orgRole" .) "serviceAccount" (dict "name" (include "platform.provisioner.serviceAccountName" .) "namespace" .Release.Namespace)) }}
{{- if .Values.operator.enabled }}
{{- $bindings = append $bindings (dict "name" (include "platform.operator.serviceAccountName" .) "clusterRole" (include "platform.operator.orgRole" .) "serviceAccount" (dict "name" (include "platform.operator.serviceAccountName" .) "namespace" .Release.Namespace)) }}
{{- end }}
{{- $_ := set $pt.namespace "roleBindings" (concat (default list $pt.namespace.roleBindings) $bindings) }}
data:
  pool-template.yaml: |
    {{- toYaml $pt | nindent 4 }}
{{- end }}
