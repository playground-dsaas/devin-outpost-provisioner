{{- if .Values.provisioner.enabled }}
{{- $name := printf "%s-%s" .Release.Namespace (include "platform.provisioner.name" .) }}
# Namespaces and Secrets are what the provisioner always writes; everything
# else comes from `manifests`, so the matching rules live in
# provisioner.rbac.rules. provisioner-admission-policy.yaml confines all of it
# to <namespacePrefix>* namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  {{- if .Values.operator.enabled }}
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create", "patch"]
  {{- end }}
  {{- with .Values.provisioner.rbac.rules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- $bind := .Values.provisioner.rbac.bindClusterRoles }}
  {{- if .Values.operator.enabled }}
  {{- $bind = append $bind (include "platform.operator.orgRole" .) }}
  {{- end }}
  {{- with $bind }}
  # RBAC only lets a subject grant roles it holds or may `bind`.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.provisioner.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
