{{- if .Values.provisioner.enabled }}
# Cluster-scoped because the provisioner creates one namespace per org and
# writes the policy objects, token Secret, snapshot binding and OutpostPool in it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "platform.provisioner.name" . }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "secrets"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["outposts.cognition.com"]
    resources: ["outpostpools"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "platform.provisioner.name" . }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "platform.provisioner.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.provisioner.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
