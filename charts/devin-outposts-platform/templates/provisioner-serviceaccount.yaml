{{- if .Values.provisioner.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.provisioner.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
  {{- with .Values.provisioner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
