{{- if and .Values.provisioner.enabled .Values.provisioner.admissionPolicy.enabled }}
{{- $name := printf "%s-%s-scope" .Release.Namespace (include "platform.provisioner.name" .) }}
{{- $prefix := required "provisioner.namespacePrefix is required" .Values.provisioner.namespacePrefix }}
# RBAC cannot scope writes to a namespace-name prefix; this policy does: the
# provisioner's ServiceAccount may only write namespaces named
# <namespacePrefix>* and objects inside them. Requires Kubernetes >= 1.30
# (OpenShift >= 4.17).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
  matchConditions:
    - name: org-provisioner
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace (include "platform.provisioner.serviceAccountName" .) | squote }}
  validations:
    - expression: >-
        request.resource.group == '' && request.resource.resource == 'namespaces'
          ? request.name.startsWith({{ $prefix | squote }})
          : request.namespace.startsWith({{ $prefix | squote }})
      message: {{ printf "org-provisioner may only write namespaces named %s* and objects in them" $prefix | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
