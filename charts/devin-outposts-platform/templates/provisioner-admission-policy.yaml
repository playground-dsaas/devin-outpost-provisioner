{{- if and .Values.provisioner.enabled .Values.provisioner.admissionPolicy.enabled }}
{{- $name := printf "%s-%s-scope" .Release.Namespace (include "platform.provisioner.name" .) }}
{{- $prefix := required "provisioner.namespacePrefix is required" .Values.provisioner.namespacePrefix }}
# RBAC cannot scope writes to a namespace-name prefix; this policy does: the
# provisioner's ServiceAccount may only write objects in namespaces named
# <namespacePrefix>* and cluster-scoped objects (namespaces included) whose own
# name starts with it. Requires Kubernetes >= 1.30 (OpenShift >= 4.17).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
  matchConditions:
    - name: org-provisioner
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace (include "platform.provisioner.serviceAccountName" .) | squote }}
  validations:
    - expression: >-
        (has(request.namespace) && request.namespace != '' ? request.namespace : request.name).startsWith({{ $prefix | squote }})
      message: {{ printf "org-provisioner may only write objects in namespaces named %s* and cluster-scoped objects named %s*" $prefix $prefix | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.provisioner.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
