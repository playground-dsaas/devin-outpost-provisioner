apiVersion: v2
name: devin-golden-home
description: >-
  Golden home volume for Devin Outposts workers: a PVC seeded with the worker
  image's /home/ubuntu and /home/linuxbrew/.linuxbrew, then snapshotted, for
  OutpostPools using the FilesystemSnapshot resume policy. Optional; install
  one release per worker image tag into the platform (system) namespace.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/playground-dsaas/devin-outpost-provisioner
sources:
  - https://github.com/playground-dsaas/devin-outpost-provisioner
  - https://github.com/CognitionAI/devin-outpost-k8s
keywords:
  - devin
  - outposts
maintainers:
  - name: Cognition
