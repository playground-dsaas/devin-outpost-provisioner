apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "golden.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "golden.labels" . | nindent 4 }}
  annotations:
    devin.cognition.com/worker-image: {{ .Values.image | quote }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.size }}
