name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked
      - name: image builds and runs
        run: |
          docker build -t org-provisioner:ci .
          docker run --rm org-provisioner:ci --version

  helm:
    runs-on: ubuntu-latest
    env:
      PLATFORM: charts/devin-outposts-platform
      KUBECONFORM: kubeconform -strict -summary -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: Fetch the operator subchart at OPERATOR_REF
        run: hack/operator-chart.sh
      - name: lint
        run: |
          helm lint $PLATFORM --set provisioner.image.repository=example/org-provisioner \
            --set provisioner.image.tag=example --set provisioner.token.existingSecret=devin-outposts-token
          helm lint $PLATFORM -f examples/values-openshift.yaml
          helm lint charts/devin-golden-home
      - name: template + kubeconform
        run: |
          helm template outposts $PLATFORM -n devin-system \
            --set provisioner.image.repository=example/org-provisioner --set provisioner.image.tag=example \
            --set provisioner.token.existingSecret=devin-outposts-token \
            --post-renderer $PLATFORM/post-render.sh | $KUBECONFORM -skip ServiceMonitor
          helm template outposts $PLATFORM -n devin-system -f examples/values-openshift.yaml \
            | $KUBECONFORM -skip ServiceMonitor
          helm template outposts $PLATFORM -n devin-system -f examples/values-openshift.yaml \
            -f examples/values-persistent-home.yaml | $KUBECONFORM -skip ServiceMonitor
          helm template golden charts/devin-golden-home -n devin-system \
            --set storageClassName=isilon --set volumeSnapshotClassName=isilon | $KUBECONFORM
      - name: package
        run: |
          mkdir -p dist
          helm package $PLATFORM -d dist
          helm package charts/devin-golden-home -d dist
      - uses: actions/upload-artifact@v4
        with:
          name: charts
          path: dist/*.tgz
