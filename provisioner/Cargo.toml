[package]
name = "org-provisioner"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Gives every Devin organization its own Outpost, namespace and the manifests you choose."
repository = "https://github.com/playground-dsaas/devin-outpost-provisioner"
publish = false

[[bin]]
name = "org-provisioner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
k8s-openapi = { version = "0.28", features = ["v1_34"] }
kube = { version = "4.0", default-features = false, features = ["client", "rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
